name: Deploy Azure and Build M365 Package

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group
        required: true
        default: rg-azure-security-posture-agent
      location:
        description: Azure region
        required: true
        default: eastus2
      tenant_id:
        description: Deployment tenant ID
        required: true
      subscription_id:
        description: Azure subscription ID
        required: true
      entra_client_id:
        description: Multi-tenant Entra application client ID
        required: true
      contact_email:
        description: M365 package support contact
        required: true
      oauth_reference_id:
        description: Existing M365 OAuth plugin vault reference ID
        required: true
        default: azure-security-posture-oauth

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Deploy application to Azure Container Apps
        shell: pwsh
        env:
          SECPA_ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
        run: >-
          ./deploy-azure.ps1
          -ResourceGroup '${{ inputs.resource_group }}'
          -Location '${{ inputs.location }}'
          -TenantId '${{ inputs.tenant_id }}'
          -SubscriptionId '${{ inputs.subscription_id }}'
          -EntraClientId '${{ inputs.entra_client_id }}'
      - name: Resolve application URL
        id: app
        shell: pwsh
        run: |
          $fqdn = az containerapp show --name azure-security-posture-agent --resource-group '${{ inputs.resource_group }}' --query 'properties.configuration.ingress.fqdn' --output tsv
          if ([string]::IsNullOrWhiteSpace($fqdn)) { throw 'Container App FQDN was not returned.' }
          "url=https://$($fqdn.Trim())" >> $env:GITHUB_OUTPUT
      - name: Build Microsoft 365 package
        shell: pwsh
        run: >-
          ./deploy-m365.ps1
          -ApiBaseUrl '${{ steps.app.outputs.url }}'
          -OAuthClientId '${{ inputs.entra_client_id }}'
          -ContactEmail '${{ inputs.contact_email }}'
          -TenantIdOrDomain 'organizations'
          -OAuthReferenceId '${{ inputs.oauth_reference_id }}'
      - name: Upload Microsoft 365 package
        uses: actions/upload-artifact@v4
        with:
          name: azure-security-posture-agent-m365
          path: m365-agent/dist/azure-security-posture-agent.zip
          if-no-files-found: error