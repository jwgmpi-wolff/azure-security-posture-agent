name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile app/main.py app/models.py
          python -m pytest -q
      - name: Build safe sample M365 package
        shell: pwsh
        run: >-
          ./m365-agent/build-package.ps1
          -ApiBaseUrl 'https://example.invalid'
          -TenantIdOrDomain 'organizations'
          -ContactEmail 'security@example.invalid'
          -OAuthClientId '00000000-0000-0000-0000-000000000000'